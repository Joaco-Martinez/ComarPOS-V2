tags:
  - name: AFIP
    description: >
      Endpoints de facturacion electronica ARCA/AFIP.
      Todos requieren autenticacion y rol ADMIN o CONTADOR.

paths:
  /afip/token:
    get:
      tags: [AFIP]
      summary: Genera y retorna el token WSAA activo
      security:
        - bearerAuth: []
      responses:
        200:
          description: Token WSAA generado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
        401:
          description: No autenticado
        403:
          description: Rol insuficiente (requiere ADMIN o CONTADOR)
        500:
          description: Error al generar token AFIP

  /afip/prueba:
    get:
      tags: [AFIP]
      summary: Healthcheck de conexion con AFIP (dummy)
      security:
        - bearerAuth: []
      responses:
        200:
          description: AFIP accesible
        401:
          description: No autenticado
        403:
          description: Rol insuficiente

  /afip/facturar:
    post:
      tags: [AFIP]
      summary: Emite una factura electronica (A, B o C) para una venta
      description: >
        Emite la factura contra WSFE con la config ARCA del negocio (o del
        dueno elegido con multi-facturacion). El tipo permitido depende de la
        condicion frente al IVA del negocio (RI -> A/B, resto -> C). El
        importe y el desglose de IVA por alicuota salen siempre de la venta
        guardada. Si faltan tipo/documento (ej. reintento) se reutilizan los
        del intento anterior o los del cliente. Genera PDF y lo imprime.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [saleId]
              properties:
                saleId:
                  type: string
                  description: ID de la venta a facturar
                tipoComprobante:
                  type: integer
                  enum: [1, 6, 11]
                  description: 1 = A, 6 = B, 11 = C (opcional)
                receiverDoc:
                  type: string
                  description: DNI/CUIT/CUIL del receptor; vacio = consumidor final (opcional)
                condicionIVAReceptor:
                  type: integer
                  description: Codigo AFIP de condicion IVA del receptor (opcional, por defecto sale del cliente)
                arcaConfigId:
                  type: string
                  description: Dueno (CUIT) que factura, solo con multi-facturacion (opcional)
      responses:
        200:
          description: Factura emitida y PDF generado
        202:
          description: AFIP no disponible, queda PENDING_AFIP para reintento automatico
        409:
          description: AFIP rechazo el comprobante, o ya hay una emision en curso para esta venta
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  cae:
                    type: string
                  caeFechaVencimiento:
                    type: string
                  nroComprobante:
                    type: integer
                  pdfUrl:
                    type: string
        401:
          description: No autenticado
        403:
          description: Rol insuficiente
        422:
          description: AFIP rechazo el comprobante (CAE no obtenido)
        503:
          description: AFIP no disponible
        500:
          description: Error interno al facturar

  /afip/nota-credito:
    post:
      tags: [AFIP]
      summary: Emite una Nota de Credito (A, B o C) para una factura existente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facturaOriginalId]
              properties:
                facturaOriginalId:
                  type: string
                  description: ID de la InvoiceAfip (factura) a acreditar
                motivo:
                  type: string
                importe:
                  type: number
                  description: Importe a acreditar (opcional, por defecto el total; no puede superar lo que queda sin acreditar)
      responses:
        200:
          description: Nota de credito emitida
        401:
          description: No autenticado
        403:
          description: Rol insuficiente
        404:
          description: Factura original no encontrada
        500:
          description: Error al emitir nota de credito

  /afip/pending-afip:
    get:
      tags: [AFIP]
      summary: Lista ventas con facturacion AFIP pendiente o fallida
      description: >
        Retorna ventas en estado PENDING, RETRY o FAILED para
        que el operador pueda reintentar la emision manual.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de ventas pendientes de facturacion
        401:
          description: No autenticado
        403:
          description: Rol insuficiente

  /afip/factura-by-sale/{saleId}:
    get:
      tags: [AFIP]
      summary: Obtiene la factura AFIP de una venta
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: saleId
          required: true
          schema:
            type: string
          description: ID de la venta
      responses:
        200:
          description: Datos de la factura emitida
        404:
          description: No existe factura para esta venta
        401:
          description: No autenticado
        403:
          description: Rol insuficiente
