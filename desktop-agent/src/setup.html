<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<title>ComarPOS Agent</title>
<style>
  :root { --accent: #0D59E7; --bg: #0C0F14; --surface: #14181F; --border: #232833; --text: #F3F5F8; --text2: #AEB7C4; --text3: #7D8695; --danger: #EF4444; --success: #22C55E; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Inter, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .card { width: 100%; max-width: 380px; }
  .logo { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .logo img { width: 44px; height: 44px; }
  h1 { font-size: 17px; font-weight: 800; text-align: center; margin: 0 0 4px; }
  .subtitle { font-size: 12.5px; color: var(--text2); text-align: center; margin: 0 0 20px; line-height: 1.5; }
  .code-input {
    width: 100%; font-size: 28px; letter-spacing: 8px; text-align: center;
    font-family: 'Consolas', monospace; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 12px 0; margin-bottom: 14px;
  }
  .code-input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; font-size: 13.5px; font-weight: 700; border: none; border-radius: 8px;
    padding: 11px 0; cursor: pointer; margin-bottom: 8px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-danger-text { background: none; color: var(--danger); font-weight: 600; padding: 8px 0; }
  .error { color: var(--danger); font-size: 12.5px; text-align: center; margin-bottom: 10px; min-height: 16px; }
  .hidden { display: none !important; }

  .status-row { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 18px; font-size: 12.5px; color: var(--text2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  .dot.ok { background: var(--success); }
  .dot.err { background: var(--danger); }

  .field { margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  select {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
  }
  .device-name { font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 2px; }
  .device-sub { font-size: 11.5px; color: var(--text3); text-align: center; margin-bottom: 18px; }
  .log { font-size: 11.5px; color: var(--text3); text-align: center; min-height: 16px; margin: 10px 0; }
  .footer-link { text-align: center; margin-top: 6px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="../assets/tray@2x.png" alt="ComarPOS" /></div>

    <!-- Vista: sin emparejar -->
    <div id="view-pair">
      <h1>Vincular ComarPOS Agent</h1>
      <p class="subtitle">Pegá el código de 6 dígitos que te dio el panel, en Configuración &gt; Impresión de tickets.</p>
      <div class="error" id="pair-error"></div>
      <input class="code-input" id="pair-code" maxlength="6" inputmode="numeric" placeholder="------" autofocus />
      <button class="btn-primary" id="btn-pair">Vincular</button>
    </div>

    <!-- Vista: emparejado -->
    <div id="view-paired" class="hidden">
      <div class="device-name" id="device-name">—</div>
      <div class="device-sub">Agente de escritorio ComarPOS</div>

      <div class="status-row">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Conectando…</span>
      </div>

      <div class="field">
        <label>Impresora</label>
        <select id="printer-select"></select>
      </div>

      <div class="field">
        <label>Ancho de papel</label>
        <select id="paper-width-select">
          <option value="80">80mm (el más común)</option>
          <option value="58">58mm</option>
        </select>
      </div>

      <button class="btn-secondary" id="btn-test-print">Imprimir ticket de prueba</button>
      <div class="log" id="print-log"></div>

      <div class="footer-link">
        <button class="btn-danger-text" id="btn-unpair">Desvincular este agente</button>
      </div>
    </div>
  </div>

  <script src="setup-renderer.js"></script>
</body>
</html>
