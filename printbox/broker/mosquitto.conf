per_listener_settings true
allow_anonymous false

# Sin TLS, uso interno (docker network / debug local). No exponer este
# puerto a internet.
listener 1883
protocol mqtt

# Con TLS, este es el que usan los printbox reales desde afuera.
# Los certs se montan como volumen (ver README.md de esta carpeta).
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key

# dynamic-security: plugin de auth/ACL administrable via mosquitto_ctrl
# (comandos MQTT), sin tener que editar archivos y reiniciar el broker por
# cada tenant nuevo. El datastore vive en /mosquitto/data, ver
# entrypoint.sh para el bootstrap inicial.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
