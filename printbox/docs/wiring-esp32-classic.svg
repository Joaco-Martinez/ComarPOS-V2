<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 860" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1150" height="860" fill="#ffffff"/>

  <text x="575" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">PrintBox — Conexiones ESP32 clásico (DevKitV1 / NodeMCU-32S)</text>
  <text x="575" y="56" text-anchor="middle" font-size="12" fill="#6b7280">Diagrama funcional de cableado (no es el footprint físico de la placa) — ver WIRING.md para el detalle</text>

  <rect x="325" y="66" width="500" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="575" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">⚠️ Variante sin probar todavía contra hardware real</text>

  <!-- ================= LEYENDA ================= -->
  <g font-size="11" fill="#374151">
    <circle cx="30" cy="112" r="5" fill="#10b981"/><text x="42" y="116">I2C (OLED)</text>
    <circle cx="140" cy="112" r="5" fill="#3b82f6"/><text x="152" y="116">SPI (W5500)</text>
    <circle cx="260" cy="112" r="5" fill="#f59e0b"/><text x="272" y="116">LEDs de estado</text>
    <circle cx="400" cy="112" r="5" fill="#8b5cf6"/><text x="412" y="116">Botón</text>
    <circle cx="480" cy="112" r="5" fill="#ef4444"/><text x="492" y="116">Alimentación (5V/3.3V)</text>
    <circle cx="660" cy="112" r="5" fill="#374151"/><text x="672" y="116">GND</text>
  </g>

  <!-- ================= PLACA ================= -->
  <rect x="90" y="177" width="200" height="520" rx="10" fill="#0f172a"/>
  <text x="190" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ESP32 clásico</text>
  <text x="190" y="225" text-anchor="middle" font-size="11" fill="#94a3b8">DevKitV1 (CP2102/CH340)</text>

  <g font-size="12">
    <!-- GPIO21 - OLED SDA -->
    <line x1="290" y1="257" x2="850" y2="257" stroke="#10b981" stroke-width="2"/>
    <rect x="296" y="239" width="128" height="16" rx="3" fill="#ecfdf5"/>
    <text x="300" y="251" fill="#065f46" font-weight="700">GPIO21 · OLED SDA</text>

    <!-- GPIO22 - OLED SCL -->
    <line x1="290" y1="302" x2="850" y2="302" stroke="#10b981" stroke-width="2"/>
    <rect x="296" y="284" width="128" height="16" rx="3" fill="#ecfdf5"/>
    <text x="300" y="296" fill="#065f46" font-weight="700">GPIO22 · OLED SCL</text>

    <!-- GPIO5 - W5500 CS -->
    <line x1="290" y1="347" x2="850" y2="347" stroke="#3b82f6" stroke-width="2"/>
    <rect x="296" y="329" width="124" height="16" rx="3" fill="#eff6ff"/>
    <text x="300" y="341" fill="#1e40af" font-weight="700">GPIO5 · W5500 CS</text>

    <!-- GPIO23 - W5500 MOSI -->
    <line x1="290" y1="392" x2="850" y2="392" stroke="#3b82f6" stroke-width="2"/>
    <rect x="296" y="374" width="140" height="16" rx="3" fill="#eff6ff"/>
    <text x="300" y="386" fill="#1e40af" font-weight="700">GPIO23 · W5500 MOSI</text>

    <!-- GPIO18 - W5500 SCK -->
    <line x1="290" y1="437" x2="850" y2="437" stroke="#3b82f6" stroke-width="2"/>
    <rect x="296" y="419" width="138" height="16" rx="3" fill="#eff6ff"/>
    <text x="300" y="431" fill="#1e40af" font-weight="700">GPIO18 · W5500 SCK</text>

    <!-- GPIO19 - W5500 MISO -->
    <line x1="290" y1="482" x2="850" y2="482" stroke="#3b82f6" stroke-width="2"/>
    <rect x="296" y="464" width="140" height="16" rx="3" fill="#eff6ff"/>
    <text x="300" y="476" fill="#1e40af" font-weight="700">GPIO19 · W5500 MISO</text>

    <!-- GPIO4 - Boton -->
    <line x1="290" y1="527" x2="850" y2="527" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="296" y="509" width="150" height="16" rx="3" fill="#f5f3ff"/>
    <text x="300" y="521" fill="#5b21b6" font-weight="700">GPIO4 · Botón reset</text>

    <!-- GPIO25 - LED rojo -->
    <line x1="290" y1="572" x2="850" y2="572" stroke="#f59e0b" stroke-width="2"/>
    <rect x="296" y="554" width="140" height="16" rx="3" fill="#fffbeb"/>
    <text x="300" y="566" fill="#92400e" font-weight="700">GPIO25 · LED rojo</text>

    <!-- GPIO26 - LED azul -->
    <line x1="290" y1="617" x2="850" y2="617" stroke="#f59e0b" stroke-width="2"/>
    <rect x="296" y="599" width="140" height="16" rx="3" fill="#fffbeb"/>
    <text x="300" y="611" fill="#92400e" font-weight="700">GPIO26 · LED azul</text>

    <!-- GPIO27 - LED verde -->
    <line x1="290" y1="662" x2="850" y2="662" stroke="#f59e0b" stroke-width="2"/>
    <rect x="296" y="644" width="145" height="16" rx="3" fill="#fffbeb"/>
    <text x="300" y="656" fill="#92400e" font-weight="700">GPIO27 · LED verde</text>
  </g>

  <!-- ================= MODULOS ================= -->
  <!-- OLED (cubre lineas y=257,302) -->
  <rect x="850" y="232" width="230" height="95" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="965" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">OLED 128x64 I2C</text>
  <text x="965" y="273" text-anchor="middle" font-size="11" fill="#065f46">driver SH1106 — dirección 0x3C</text>
  <text x="965" y="297" text-anchor="middle" font-size="11" fill="#374151">VCC → 3.3V</text>
  <text x="965" y="315" text-anchor="middle" font-size="11" fill="#374151">GND → GND común</text>

  <!-- W5500 (cubre lineas y=347,392,437,482) -->
  <rect x="850" y="337" width="230" height="160" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="965" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">W5500 (Ethernet)</text>
  <text x="965" y="380" text-anchor="middle" font-size="11" fill="#1e40af">link punto a punto → impresora</text>
  <text x="965" y="472" text-anchor="middle" font-size="11" fill="#374151">VCC → 3.3V ⚠️ (no 5V)</text>
  <text x="965" y="490" text-anchor="middle" font-size="11" fill="#374151">GND → GND común · RST/INT: sin usar</text>

  <!-- Boton (cubre linea y=527) -->
  <rect x="850" y="505" width="230" height="44" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="965" y="525" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Botón factory reset</text>
  <text x="965" y="542" text-anchor="middle" font-size="11" fill="#374151">normal-abierto, directo a GND (pull-up interno)</text>

  <!-- LEDs (cubre lineas y=572,617,662) -->
  <rect x="850" y="557" width="230" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="965" y="579" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">3 LEDs de estado</text>
  <text x="965" y="597" text-anchor="middle" font-size="11" fill="#374151">c/u con resistencia 220-330Ω en serie</text>
  <text x="965" y="615" text-anchor="middle" font-size="11" fill="#374151">GPIOxx → resistencia → ánodo LED</text>
  <text x="965" y="633" text-anchor="middle" font-size="11" fill="#374151">cátodo LED → GND común</text>
  <text x="965" y="657" text-anchor="middle" font-size="10" fill="#6b7280">Rojo=boot/pairing · Verde=ready · parpadeo=imprimiendo</text>

  <!-- ================= ALIMENTACION ================= -->
  <rect x="90" y="727" width="990" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="585" y="752" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Alimentación (regla de oro: todos los GND van juntos)</text>

  <g font-size="12" fill="#374151">
    <rect x="115" y="772" width="150" height="40" rx="6" fill="#ffffff" stroke="#ef4444"/>
    <text x="190" y="797" text-anchor="middle" font-weight="700">Fuente 5V</text>

    <line x1="265" y1="792" x2="335" y2="792" stroke="#ef4444" stroke-width="2"/>
    <polygon points="335,792 325,787 325,797" fill="#ef4444"/>

    <rect x="340" y="772" width="130" height="40" rx="6" fill="#ffffff" stroke="#ef4444"/>
    <text x="405" y="797" text-anchor="middle" font-weight="700">Switch ON/OFF</text>

    <line x1="470" y1="792" x2="540" y2="792" stroke="#ef4444" stroke-width="2"/>
    <polygon points="540,792 530,787 530,797" fill="#ef4444"/>

    <rect x="545" y="772" width="140" height="40" rx="6" fill="#ffffff" stroke="#ef4444"/>
    <text x="615" y="797" text-anchor="middle" font-weight="700">5V placa + W5500*</text>

    <line x1="685" y1="792" x2="755" y2="792" stroke="#374151" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="760" y="772" width="130" height="40" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="825" y="797" text-anchor="middle" font-weight="700" fill="#92400e">Fan 5V (opcional)</text>

    <rect x="900" y="772" width="150" height="40" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="975" y="797" text-anchor="middle" font-weight="700">GND común a todo</text>

    <text x="190" y="827" text-anchor="middle" font-size="10" fill="#991b1b">*W5500 a 3.3V si el módulo no tiene regulador propio — ver nota de la caja arriba</text>
  </g>
</svg>
