[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

monitor_dtr = 0
monitor_rts = 0

lib_deps =
  arduino-libraries/Ethernet@^2.0.2
  bblanchon/ArduinoJson@^7
  knolleary/PubSubClient@^2.8
  ; Envuelve EthernetClient con TLS para hablar HTTPS (pairing) y MQTTS
  ; (broker). No probado todavia contra hardware real -- si esta version
  ; no resuelve en el registro de PlatformIO, buscar "SSLClient ethernet
  ; esp32" y ajustar el nombre/version acá. Ver printbox/README.md.
  govorox/SSLClient@^2.0.4
  ; Pantalla OLED de estado (SSD1306 128x64, I2C). Pines en main.cpp
  ; (OLED_SDA/OLED_SCL) -- confirmar contra el wiring real de la placa.
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.9