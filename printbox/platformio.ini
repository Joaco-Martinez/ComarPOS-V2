[platformio]
; Sin esto, "pio run" sin -e intenta compilar TODOS los envs de abajo --
; la S3 es la placa ya probada contra hardware real, la dejamos como
; default para no romper el flujo de trabajo de siempre. Para la variante
; ESP32 clasica: "pio run -e esp32-classic" (o "pio run -t upload -e
; esp32-classic" para flashear esa).
default_envs = esp32-s3

; ============================================================
; Config compartida entre las dos variantes de placa
; ============================================================
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino

monitor_speed = 115200

; ============================================================
; PARCHE W5500 + ESP32
; ============================================================
; Corrige las transferencias SPI en bloque de Ethernet para evitar
; corrupcion de datos -- bug del driver SPI del nucleo ESP32 en general
; (no especifico de la S3), asi que aplica a las dos variantes.
extra_scripts =
    pre:patch_ethernet_esp32_fixes.py

; ============================================================
; LIBRERÍAS
; ============================================================
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.9
    ; Muchos modulos "OLED 128x64 I2C" vendidos como SSD1306 son en realidad
    ; SH1106 (chip distinto, memoria de video de 132 columnas en vez de
    ; 128) -- responden al I2C sin error pero no dibujan nada con el driver
    ; de SSD1306. Ver PRINTBOX_OLED_DRIVER_SH1106 en main.cpp.
    adafruit/Adafruit SH110X@^2.1.11

; ============================================================
; Variante 1: ESP32-S3-DevKitC-1 (probada contra hardware real, ver
; printbox/README.md) -- USB nativo (CDC), pines de OLED/W5500/LEDs segun
; WIRING.md.
; ============================================================
[env:esp32-s3]
board = esp32-s3-devkitc-1
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; Variante 2: ESP32 "clasico" (DevKitV1 / NodeMCU-32S con puente
; USB-serie CP2102 o CH340, sin USB nativo) -- NO probada todavia contra
; hardware real. Pines distintos a la S3 porque GPIO6-11 estan reservados
; para la flash SPI interna en este chip (ver WIRING.md, seccion "Variante
; ESP32 clasico"): no se pueden repetir los pines de la S3 tal cual.
; ============================================================
[env:esp32-classic]
board = esp32dev

build_flags =
    -DPRINTBOX_BOARD_CLASSIC=1
